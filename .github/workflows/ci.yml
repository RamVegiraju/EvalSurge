name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify public CI dependency sources
        run: python3 scripts/check_ci_prerequisites.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Refresh compatible dependencies on scheduled runs
        if: github.event_name == 'schedule'
        run: |
          uv lock --upgrade
          python3 scripts/check_ci_prerequisites.py
      - run: uv sync --locked --extra agents --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/export_openapi.py --check
      - run: uv run --no-sync openapi-spec-validator docs/openapi.json
      - run: uv build --no-build-isolation
      - run: uv run --no-sync python scripts/verify_wheel.py
      - run: uv run --no-sync python scripts/verify_remote_install.py --offline
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify public CI dependency sources
        run: python3 scripts/check_ci_prerequisites.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - name: Refresh compatible dependencies on scheduled runs
        if: github.event_name == 'schedule'
        run: |
          uv lock --upgrade
          python3 scripts/check_ci_prerequisites.py
      - run: uv sync --locked --extra agents --group dev
      - name: Audit the complete locked dependency graph
        run: |
          mkdir -p artifacts
          uv export --quiet --locked --extra agents --group dev --no-emit-project --output-file artifacts/audit-requirements.txt
          uv run --no-sync pip-audit --disable-pip --require-hashes --progress-spinner off --vulnerability-service osv --requirement artifacts/audit-requirements.txt
