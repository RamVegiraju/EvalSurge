# Preparation only. No resource names, workspace, profile or approval is selected.
bundle:
  name: evalsurge-private-app-runner

variables:
  runner_app_name:
    description: Explicitly approved private runner App name; no automatic default
  result_volume:
    description: Existing protected catalog.schema.volume; no volume is provisioned

sync:
  include:
    - wheel/*.whl
    - operator.json

resources:
  apps:
    private_runner:
      name: ${var.runner_app_name}
      source_code_path: .
      resources:
        - name: result-artifacts
          uc_securable:
            securable_full_name: ${var.result_volume}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: result-artifacts-read
          uc_securable:
            securable_full_name: ${var.result_volume}
            securable_type: VOLUME
            permission: READ_VOLUME
      config:
        command: ["python", "app.py"]
        env:
          - name: EVALSURGE_EXPORT_VOLUME
            value_from: result-artifacts

targets:
  reviewed: {}
