[project]
name = "evalsurge"
version = "0.2.1.dev2026101202"
description = "Concurrency benchmarks and evidence-aware MLflow evaluation for hosted agents"
readme = "README.md"
license = "MIT"
authors = [{name = "Ram Vegiraju"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.13.5,<3"]

[project.optional-dependencies]
local = ["evalsurge[server]"]
server = ["fastapi>=0.141.1,<1", "uvicorn>=0.54,<1", "openai>=3.19.2,<4", "mlflow>=3.16.1,<3.17", "databricks-sdk>=0.146,<1", "locust>=2.46.6,<3", "python-dotenv>=1.2.3,<2", "requests>=2.34.2,<3", "gevent>=26.9,<27"]
agents = ["evalsurge[server]", "langgraph>=1.2.12,<2", "langgraph-checkpoint>=4.2,<5", "langchain-core>=1.6.5,<2", "langchain-openai>=1.6.6,<2", "openai-agents>=0.22.3,<1"]

[project.urls]
Repository = "https://github.com/RamVegiraju/EvalSurge"
Issues = "https://github.com/RamVegiraju/EvalSurge/issues"

[project.scripts]
evalsurge = "evalsurge.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16.9,<1", "openapi-spec-validator>=0.9,<1", "pip-audit>=2.10.1,<3", "hatchling>=1.32.4,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "SIM"]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["benchmark_agents", "evalsurge"]

[tool.hatch.build.targets.sdist]
exclude = ["/.isaac"]
